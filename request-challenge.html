<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلب تحدٍّ | وكالة الشايب</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101010;
      color: #fff4d6;
    }

    .card {
      max-width: 560px;
      margin: 25px auto;
      padding: 25px;
      background: #1b1b1b;
      border: 1px solid #c8a653;
      border-radius: 18px;
      box-shadow: 0 10px 30px #0008;
    }

    h1 {
      color: #e5c36a;
      text-align: center;
      margin-top: 0;
    }

    .description {
      text-align: center;
      color: #ccc;
      line-height: 1.8;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 9px;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    input:focus, textarea:focus {
      outline: 1px solid #e5c36a;
      border-color: #e5c36a;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 23px;
      border: 0;
      border-radius: 9px;
      background: #d4af57;
      color: #17120a;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 9px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    #result a {
      color: #f4d57f;
      overflow-wrap: anywhere;
    }

    .success { display: block !important; background: #173d27; }
    .error { display: block !important; background: #512323; }

    .footer {
      text-align: center;
      color: #d4af57;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>⚔️ طلب تحدٍّ جديد</h1>

    <p class="description">
      وكالة الشايب الرسمية<br>
      أدخل بياناتك لإنشاء طلب تحدٍّ ومشاركته مع المذيعين.
    </p>

    <form id="requestForm">
      <label for="requesterName">اسم المذيع</label>
      <input id="requesterName" type="text"
        maxlength="100" required>

      <label for="requesterId">ID المذيع</label>
      <input id="requesterId" type="text"
        maxlength="50" required>

      <label for="requesterImage">صورة المذيع</label>
      <input id="requesterImage" type="file"
        accept="image/jpeg,image/png,image/webp"
        required>

      <label for="challengeLevel">مستوى التحدي</label>
      <input id="challengeLevel" type="text"
        maxlength="100"
        placeholder="مثال: مستوى 50" required>

      <label for="challengeDay">اليوم المطلوب للتحدي</label>
      <input id="challengeDay" type="date" required>

      <label for="proposedAt">ساعة التحدي المقترحة</label>
      <input id="proposedAt" type="time" required>

      <label for="notes">ملاحظات إضافية (اختياري)</label>
      <textarea id="notes" rows="3" maxlength="1000"
        placeholder="أي معلومات إضافية"></textarea>

      <button id="submitButton" type="submit">
        إرسال طلب التحدي
      </button>

      <div id="result" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">⚜️ وكالة الشايب ⚜️</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

      "https://hzcnkywuabugjebtwzmv.supabase.co";

      SUPABASE_URL,

    );

        .value.trim();

      const level = document.getElementById("challengeLevel")
        .value.trim();

      const day = document.getElementById("challengeDay").value;
      const time = document.getElementById("proposedAt").value;

      const notes = document.getElementById("notes")
        .value.trim();

      const file = document.getElementById("requesterImage")
        .files[0];

        showResult("اختاري صورة المذيع أولًا.", "error");
        return;
      }

        "image/jpeg",
        "image/png",
        "image/webp"
      ];
