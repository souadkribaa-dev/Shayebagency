
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الانضمام إلى وكالة الشايب</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    .container {
      max-width: 560px;
      margin: 25px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 22px #00000012;
    }

    h1 { text-align: center; color: #173b63; }
    p { line-height: 1.8; }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #173b63;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .success {
      display: block !important;
      background: #e5f7e9;
      color: #17652b;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a31e1e;
    }

    .hint { font-size: 13px; color: #666; }
  </style>
</head>

<body>
  <main class="container">
    <h1>طلب الانضمام إلى وكالة الشايب</h1>
    <p>املئي البيانات التالية وأرسلي فيديو الأوديشن للمراجعة.</p>

    <form id="auditionForm">
      <label for="name">الاسم الكامل</label>
      <input id="name" name="name"
             required maxlength="100">

      <label for="phone">رقم الهاتف</label>
      <input id="phone" name="phone" type="tel"
             required maxlength="30">

      <label for="likee_name">اسم الحساب في Likee</label>
      <input id="likee_name" name="likee_name"
             required maxlength="100">

      <label for="likee_url">رابط حساب Likee (اختياري)</label>
      <input id="likee_url" name="likee_url"
             type="url" placeholder="https://...">

      <label for="video">فيديو الأوديشن</label>
      <input id="video" name="video" type="file"
             accept="video/*" required>

      <p class="hint">
        للتجربة الأولى، اختاري فيديو صغيرًا، ويفضل أقل من 6 ميغابايت.
      </p>

      <button id="submitButton" type="submit">
        إرسال الطلب
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://hzcnkywuabugjebtwzmv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_X5WT8XgjYkrrB4iSFmWexw_aTJepYkP";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("auditionForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
      message.style.display = "block";
    }

    function safeError(error) {
      if (!error) return "خطأ غير معروف";

      return [
        error.message,
        error.code ? "رمز الخطأ: " + error.code : "",
        error.details ? "التفاصيل: " + error.details : "",
        error.hint ? "التلميح: " + error.hint : ""
      ].filter(Boolean).join("\n");
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const likeeName =
        document.getElementById("likee_name").value.trim();

      const likeeUrl =
        document.getElementById("likee_url").value.trim();

      const file =
        document.getElementById("video").files[0];

      if (!name || !phone || !likeeName || !file) {
        showMessage(
          "يرجى ملء الحقول المطلوبة واختيار الفيديو.",
          "error"
        );
        return;
      }

      if (!file.type.startsWith("video/")) {
        showMessage("يرجى اختيار ملف فيديو صالح.", "error");
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        showMessage(
          "حجم الفيديو أكبر من 50 ميغابايت. اختاري فيديو أصغر.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ رفع الفيديو...";
      showMessage("جارٍ رفع الفيديو. لا تغلقي الصفحة.", "");

      let uploadedPath = null;

      try {
        const safeName = file.name
          .replace(/[^\w.-]+/g, "_")
          .slice(-100);

        const filePath =
          "auditions/" +
          Date.now() + "_" +
          Math.random().toString(36).slice(2, 10) +
          "_" + safeName;

        const { data: uploadData, error: uploadError } =
          await client.storage
            .from("audition-videos")
            .upload(filePath, file, {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            });

        if (uploadError) {
          throw new Error(
            "فشل رفع الفيديو:\n" + safeError(uploadError)
          );
        }

        uploadedPath = uploadData.path;

        button.textContent = "جارٍ حفظ بيانات الطلب...";

        const { error: insertError } = await client
          .from("audition_requests")
          .insert({
            name: name,
            phone: phone,
            likee_name: likeeName,
            likee_url: likeeUrl || null,
            audition_url: uploadedPath,
            status: "pending"
          });

        if (insertError) {
          console.error("Database insert error:", insertError);

          showMessage(
            "تم رفع الفيديو، لكن تعذر حفظ بيانات الطلب.\n\n" +
            safeError(insertError) +
            "\n\nاحتفظي بهذه الرسالة وأرسليها للمشرفة.",
            "error"
          );
          return;
        }

        showMessage(
          "تم إرسال طلبك بنجاح. ستتم مراجعته من إدارة الوكالة.",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error("Audition submission error:", error);

        showMessage(
          error.message ||
          "حدث خطأ غير متوقع أثناء إرسال الطلب.",
          "error"
        );

      } finally {
        button.disabled = false;
        button.textContent = "إرسال الطلب";
      }
    });
  </script>
</body>
</html>
