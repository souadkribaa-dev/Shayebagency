<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انضم إلى وكالة الشايب</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f7f7f9;
color:#222;
padding-bottom:30px;
}

.header{
background:linear-gradient(135deg,#ff3b81,#ff5a5f);
color:white;
padding:30px 18px 35px;
border-radius:0 0 30px 30px;
text-align:center;
}

.header h1{
margin:0 0 10px;
font-size:30px;
}

.header p{
margin:0;
font-size:15px;
}

.container{
max-width:650px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:22px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px #00000012;
}

.card h2{
margin-top:0;
font-size:21px;
}

.note{
font-size:14px;
color:#777;
line-height:1.8;
}

.videoLink{
display:block;
background:#ff3b81;
color:white;
text-decoration:none;
padding:16px;
border-radius:14px;
font-weight:bold;
font-size:17px;
text-align:center;
margin-top:15px;
}

.step{
display:flex;
gap:12px;
align-items:flex-start;
margin:15px 0;
}

.number{
min-width:34px;
height:34px;
border-radius:50%;
background:#ff3b81;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.info{
background:#fff5f8;
border-right:4px solid #ff3b81;
padding:12px;
border-radius:10px;
line-height:1.8;
font-size:14px;
}

label{
display:block;
font-weight:bold;
font-size:14px;
margin:15px 0 7px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
font-family:inherit;
}

input:focus{
outline:none;
border-color:#ff3b81;
}

.filebox{
border:2px dashed #ddd;
border-radius:15px;
padding:18px;
background:#fafafa;
text-align:center;
margin-top:8px;
}

.filebox input{
border:0;
padding:5px;
}

.preview{
width:100%;
max-height:300px;
object-fit:contain;
border-radius:14px;
margin-top:15px;
display:none;
background:#111;
}

.submit{
display:block;
width:100%;
border:none;
background:#ff3b81;
color:white;
padding:18px;
border-radius:15px;
font-size:19px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
box-shadow:0 5px 15px #ff3b8140;
}

.submit:disabled{
opacity:.6;
}

.status{
margin-top:15px;
padding:14px;
border-radius:12px;
display:none;
line-height:1.7;
font-weight:bold;
}

.success{
display:block;
background:#e8f8ef;
color:#18794e;
}

.error{
display:block;
background:#ffe9ed;
color:#b42345;
}

.whatsapp{
display:block;
text-align:center;
background:#25D366;
color:white;
text-decoration:none;
padding:16px;
border-radius:14px;
font-weight:bold;
font-size:17px;
}

.back{
display:block;
text-align:center;
margin:20px 0;
color:#ff3b81;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header class="header">

<h1>🎤 انضم إلى وكالة الشايب</h1>

<p>
ابدأ رحلتك معنا كمذيع Likee
</p>

</header>
