<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مذيعو وكالة الشايب | Shayeb Agency</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #3b176e 0%, transparent 35%),
        radial-gradient(circle at bottom left, #102a56 0%, transparent 35%),
        #080812;
      color: white;
      min-height: 100vh;
    }

    /* الهيدر */
    header {
      padding: 25px 15px;
      text-align: center;
      background: rgba(10, 10, 25, 0.85);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(90deg, #ffd700, #ff7bff, #8b7cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 8px;
      color: #cfcfe8;
      font-size: 14px;
    }

    /* الأزرار */
    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .nav a {
      text-decoration: none;
      color: white;
      padding: 10px 17px;
      border-radius: 25px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      transition: 0.3s;
      font-size: 14px;
    }

    .nav a:hover {
      background: linear-gradient(90deg, #7c3cff, #d946ef);
      transform: translateY(-2px);
    }

    /* العنوان */
    .page-title {
      text-align: center;
      padding: 45px 15px 25px;
    }

    .page-title h1 {
      font-size: 34px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ffffff, #d7a8ff, #ffd76a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-title p {
      color: #bdbdd0;
      font-size: 16px;
    }

    /* حالة التحميل */
    #loading {
      text-align: center;
      padding: 50px 20px;
      color: #cfcfe8;
      font-size: 18px;
    }

    /* شبكة المذيعين */
    .container {
      width: 94%;
      max-width: 1200px;
      margin: auto;
      padding-bottom: 50px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    /* بطاقة المذيع */
    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      transition: 0.35s;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow:
        0 20px 50px rgba(120,60,255,0.25),
        0 0 25px rgba(255,215,0,0.08);
    }

    /* صورة المذيع */
    .image-wrapper {
      width: 100%;
      height: 320px;
      overflow: hidden;
      background: linear-gradient(135deg, #1d1535, #101526);
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    .card:hover .card-image {
      transform: scale(1.05);
    }

    .card-content {
      padding: 20px;
    }

    .name {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info div {
      background: rgba(255,255,255,0.06);
      padding: 10px 12px;
      border-radius: 12px;
      color: #ddd;
      font-size: 14px;
    }

    .info strong {
      color: #ffd45c;
    }

    .likee-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 13px;
      border-radius: 15px;
      background: linear-gradient(90deg, #7c3aed, #d946ef);
      transition: 0.3s;
    }

    .likee-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(217,70,239,0.35);
    }

    /* عدم وجود بيانات */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
    }

    /* خطأ */
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #ff9b9b;
      background: rgba(255,0,0,0.07);
      border: 1px solid rgba(255,0,0,0.15);
      border-radius: 20px;
    }

    /* الفوتر */
    footer {
      text-align: center;
      padding: 30px 15px;
      color: #9292a7;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 30px;
    }

    /* الهاتف */
    @media (max-width: 600px) {

      .logo {
        font-size: 23px;
      }

      .page-title {
        padding-top: 35px;
      }

      .page-title h1 {
        font-size: 27px;
      }

      .page-title p {
        font-size: 14px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .image-wrapper {
        height: 360px;
      }

      .nav a {
        font-size: 13px;
        padding: 9px 13px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    ✨ Shayeb Agency | وكالة الشايب
  </div>

  <div class="subtitle">
    وكالة لدعم وتطوير المذيعين على Likee
  </div>

  <div class="nav">

    <a href="index.html">
      🏠 الرئيسية
    </a>

    <a href="join.html">
      🎤 انضم إلينا
    </a>

    <a href="https://wa.me/213673860283" target="_blank">
      💬 تواصل معنا
    </a>

  </div>

</header>


<section class="page-title">

  <h1>
    ⭐ مذيعو وكالة الشايب ⭐
  </h1>

  <p>
    تعرفوا على مذيعي وكالتنا واكتشفوا المواهب المميزة
  </p>

</section>


<div class="container">

  <div id="loading">
    ⏳ جارٍ تحميل المذيعين...
  </div>

  <div id="cards" class="cards"></div>

</div>


<footer>

  © 2026 Shayeb Agency  
  <br>
  جميع الحقوق محفوظة

</footer>


<script>

  /* بيانات Supabase */

  const SUPABASE_URL =
    "https://hzcnkywuabugjebtwzmv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_X5WT8XgjYkrrB4iSFmWexw_aTJepYkP";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* الصورة الافتراضية */

  const placeholder =
    "https://via.placeholder.com/600x700/151525/ffffff?text=Shayeb+Agency";


  /* تحميل المذيعين */

  async function loadBroadcasters() {

    const loading =
      document.getElementById("loading");

    const cards =
      document.getElementById("cards");

    try {

      const { data, error } =
        await supabaseClient
          .from("Shayeb agency")
          .select("*")
          .order("id", {
            ascending: false
          });


      if (error) {

        console.error(error);

        loading.style.display = "none";

        cards.innerHTML = `
          <div class="error">
            ❌ حدث خطأ أثناء تحميل بيانات المذيعين
            <br><br>
            ${error.message}
          </div>
        `;

        return;
      }


      loading.style.display = "none";


      if (!data || data.length === 0) {

        cards.innerHTML = `
          <div class="empty">
            👤 لا يوجد مذيعون مضافون حالياً
          </div>
        `;

        return;
      }


      cards.innerHTML = "";


      data.forEach(broadcaster => {

        const name =
          broadcaster.name ||
          "مذيع وكالة الشايب";


        const target =
          broadcaster.target ||
          "غير محدد";


        const hours =
          broadcaster.hours ||
          "غير محدد";


        /*
          مهم جداً:
          اسم العمود الصحيح هو image_url
        */

        let image =
          broadcaster.image_url || "";


        /*
          إذا كان image_url رابطاً كاملاً
          نستخدمه مباشرة.

          وإذا كان مجرد اسم ملف داخل Storage
          نقوم بإنشاء الرابط تلقائياً.
        */

        if (
          image &&
          !image.startsWith("http")
        ) {

          const { data: publicData } =
            supabaseClient.storage
              .from("broadcaster-images")
              .getPublicUrl(image);

          if (publicData &&
              publicData.publicUrl) {

            image =
              publicData.publicUrl;
          }
        }


        if (!image) {
          image = placeholder;
        }


        const likeeUrl =
          broadcaster.likee_url ||
          "#";


        const card =
          document.createElement("div");

        card.className = "card";


        card.innerHTML = `

          <div class="image-wrapper">

            <img
              class="card-image"
              src="${image}"
              alt="${name}"
              loading="lazy"
              onerror="this.onerror=null;this.src='${placeholder}'"
            >

          </div>


          <div class="card-content">

            <div class="name">
              ${name}
            </div>


            <div class="info">

              <div>
                🎯
                <strong>التارجت:</strong>
                ${target}
              </div>


              <div>
                ⏰
                <strong>الساعات:</strong>
                ${hours}
              </div>

            </div>


            ${
              likeeUrl !== "#"
              ?
              `
              <a
                class="likee-btn"
                href="${likeeUrl}"
                target="_blank"
                rel="noopener"
              >
                🎥 مشاهدة على Likee
              </a>
              `
              :
              `
              <div
                class="likee-btn"
                style="opacity:.5;"
              >
                🎥 رابط Likee غير متوفر
              </div>
              `
            }

          </div>

        `;


        cards.appendChild(card);

      });

    }

    catch (error) {

      console.error(error);

      loading.style.display = "none";

      cards.innerHTML = `
        <div class="error">
          ❌ حدث خطأ غير متوقع
          <br><br>
          حاول تحديث الصفحة.
        </div>
      `;

    }

  }


  /* تشغيل */

  loadBroadcasters();

</script>

</body>
</html>
