<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>لوحة إدارة وكالة الشايب</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f7;
      color: #222;
      font-family: Arial, Tahoma, sans-serif;
    }

    .header {
      background: linear-gradient(
        135deg,
        #ff3b81,
        #ff5a5f
      );

      color: white;
      padding: 30px 20px;
      border-radius: 0 0 30px 30px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0;
      font-size: 16px;
      opacity: 0.9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 17px;
      color: #555;
      margin-bottom: 12px;
    }

    .number {
      font-size: 36px;
      font-weight: bold;
      color: #ff3b81;
    }

    .panel {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 21px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #ff3b81;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .back {
      background: #333;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f0fff4;
      color: #16803c;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }

      .container {
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <header class="header">

    <div class="container">

      <h1>
        لوحة إدارة وكالة الشايب
      </h1>

      <p class="subtitle">
        مرحبًا بك في لوحة التحكم
      </p>

    </div>

  </header>


  <main class="container">

    <div class="cards">

      <div class="card">

        <div class="card-title">
          عدد المذيعين
        </div>

        <div
          class="number"
          id="presenters"
        >
          0
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          عدد الطلبات
        </div>

        <div
          class="number"
          id="requests"
        >
          0
        </div>

      </div>

    </div>


    <div class="panel">

      <h2>
        إدارة الوكالة
      </h2>

      <button
        onclick="testPage()"
      >
        اختبار لوحة الإدارة
      </button>


      <button
        class="back"
        onclick="goHome()"
      >
        العودة إلى الموقع
      </button>


      <div
        id="message"
        class="message"
      >
        لوحة الإدارة جاهزة للعمل ✅
      </div>

    </div>

  </main>


  <footer class="footer">

    Shayeb Agency © 2026

  </footer>


  <script>

    function testPage() {

      document.getElementById("message").textContent =
        "تم تشغيل لوحة الإدارة بنجاح ✅";

    }


    function goHome() {

      window.location.href = "index.html";

    }


    document.getElementById("presenters").textContent = "0";

    document.getElementById("requests").textContent = "0";

  </script>

</body>

</html>
