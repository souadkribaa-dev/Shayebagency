<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>إدارة وكالة الشايب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f6f8;
      font-family: Arial, Tahoma, sans-serif;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #ff3b81, #ff5a5f);
      color: white;
      padding: 25px 16px 30px;
      border-radius: 0 0 26px 26px;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .header p {
      margin: 0;
      opacity: .92;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 15px #0001;
    }

    .box h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      color: #ff3b81;
      margin-top: 10px;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      background: #ff3b81;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #444;
    }

    .status {
      margin-top: 20px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 15px #0001;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="wrap">
      <h1>لوحة إدارة وكالة الشايب</h1>
      <p>مرحبًا بك في لوحة التحكم الخاصة بالوكالة</p>
    </div>
  </header>

  <main class="wrap">

    <section class="dashboard">

      <div class="box">
        <h2>عدد المذيعين</h2>
        <div class="number" id="presentersCount">0</div>
      </div>

      <div class="box">
        <h2>عدد الطلبات</h2>
        <div class="number" id="requestsCount">0</div>
      </div>

    </section>

    <section class="box" style="margin-top:20px;">
      <h2>إدارة الوكالة</h2>

      <div class="actions">
        <button onclick="showMessage()">
          تحديث البيانات
        </button>

        <button class="secondary" onclick="goToWebsite()">
          العودة إلى الموقع
        </button>
      </div>
    </section>

    <section class="status">
      <h2>حالة لوحة الإدارة</h2>
      <p id="statusMessage" class="success">
        لوحة الإدارة تعمل بشكل صحيح ✅
      </p>
    </section>

  </main>

  <script>
    function showMessage() {
      document.getElementById("statusMessage").textContent =
        "تم تحديث لوحة الإدارة بنجاح ✅";

      document.getElementById("statusMessage").className =
        "success";
    }

    function goToWebsite() {
      window.location.href = "index.html";
    }

    document.getElementById("presentersCount").textContent = "0";
    document.getElementById("requestsCount").textContent = "0";
  </script>

</body>
</html>
