<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة وكالة الشايب</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f6f6f8;
font-family:Arial,Tahoma,sans-serif;
color:#222
}

.header{
background:linear-gradient(135deg,#ff3b81,#ff5a5f);
color:#fff;
padding:22px 16px 28px;
border-radius:0 0 26px 26px
}

.wrap{
max-width:760px;
margin:auto;
padding:16px
}

.header h1{
margin:0 0 7px;
font-size:27px
}

.header p{
margin:0;
opacity:.92
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}

.card{
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 3px 15px #0001
}

.photo{
display:block;
position:relative;
aspect-ratio:1/1;
background:#ddd
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.like{
position:absolute;
bottom:9px;
left:9px;
background:#ff3b81;
color:#fff;
border-radius:20px;
padding:6px 10px;
font-size:12px
}

.info{
padding:11px 12px 13px
}

.name{
font-size:17px;
font-weight:800;
margin-bottom:8px
}

.stats{
display:flex;
gap:6px;
flex-wrap:wrap
}

.stat{
background:#f4f4f6;
border-radius:10px;
padding:6px 8px;
font-size:12px
}

.stat b{
color:#ff3b81
}

.tools{
display:flex;
gap:8px;
margin:16px 0;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:12px;
padding:11px 14px;
font-weight:bold;
cursor:pointer
}

.primary{
background:#222;
color:#fff
}

.pink{
background:#ff3b81;
color:#fff
}

.danger{
background:#ffe8ee;
color:#c21e55
}

.muted{
background:#fff;
border:1px solid #ddd
}

.status{
margin:12px 0;
padding:11px 13px;
border-radius:12px;
background:#fff;
font-size:13px
}

.ok{
border-right:4px solid #2ca66f
}

.err{
border-right:4px solid #e53935
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:10;
align-items:center;
justify-content:center;
padding:18px
}

.modal.show{
display:flex
}

.box{
background:#fff;
width:100%;
max-width:520px;
border-radius:20px;
padding:18px;
max-height:92vh;
overflow:auto
}

.box h2{
margin-top:0
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:10px 0 5px
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:11px;
font-size:15px
}

.row{
display:flex;
gap:8px;
margin-top:15px
}

.row .btn{
flex:1
}

.note{
font-size:12px;
color:#777;
line-height:1.6
}

.hidden{
display:none!important
}

.login{
max-width:520px;
margin:28px auto;
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:0 3px 15px #0001
}

.small{
font-size:12px;
color:#777
}

.preview{
width:110px;
height:110px;
border-radius:14px;
object-fit:cover;
margin-top:8px;
display:block
}

.empty{
text-align:center;
background:#fff;
border-radius:18px;
padding:35px;
color:#777;
grid-column:1/-1
}

.fileBox{
border:2px dashed #ddd;
border-radius:14px;
padding:12px;
background:#fafafa
}

@media(max-width:430px){
.grid{
gap:10px
}

.info{
padding:9px
}

.name{
font-size:15px
}
}
</style>
</head>

<body>

<header class="header">
<div class="wrap">

<h1>إدارة وكالة الشايب ⚙️</h1>

<p>صفحة خاصة لإضافة وتعديل بيانات المذيعين</p>

</div>
</header>

<main class="wrap">

<div id="login" class="login">

<h2>دخول الإدارة</h2>

<p class="small">
استخدمي بريدك وكلمة المرور في حساب Supabase.
</p>

<label>البريد الإلكتروني</label>

<input
id="email"
type="email"
placeholder="you@example.com">

<label>كلمة المرور</label>

<input
id="password"
type="password"
placeholder="••••••••">

<div class="row">

<button
class="btn pink"
onclick="signIn()">
دخول
</button>

<button
class="btn muted"
onclick="signUp()">
إنشاء حساب
</button>

</div>

<div
id="loginStatus"
class="status hidden">
</div>

</div>


<div id="app" class="hidden">

<div class="tools">

<button
class="btn primary"
onclick="addCard()">
＋ إضافة مذيع
</button>

<button
class="btn muted"
onclick="loadData()">
↻ تحديث
</button>

<button
class="btn danger"
onclick="signOut()">
خروج
</button>

</div>

<div
id="status"
class="status">
جاري التحميل...
</div>

<div
id="grid"
class="grid">
</div>

</div>

</main>


<div id="modal" class="modal">

<div class="box">

<h2 id="modalTitle">
إضافة مذيع
</h2>

<label>الاسم</label>

<input
id="fName"
placeholder="مثال: أحمد">


<label>رابط Likee</label>

<input
id="fLink"
placeholder="https://l.likee.video/...">


<label>الصورة</label>

<div class="fileBox">

<input
id="fImageFile"
type="file"
accept="image/*">

<img
id="preview"
class="preview hidden"
alt="معاينة الصورة">

</div>


<label>Target</label>

<input
id="fTarget"
placeholder="مثال: 784963">


<label>الساعات</label>

<input
id="fHours"
placeholder="مثال: 35">


<div class="row">

<button
id="saveBtn"
class="btn pink"
onclick="saveCard()">
حفظ
</button>

<button
class="btn muted"
onclick="closeModal()">
إلغاء
</button>

</div>

<p class="note">
اختاري الصورة مباشرة من هاتفك.
سيتم رفعها تلقائيًا إلى Supabase Storage.
</p>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://hzcnkywuabugjebtwzmv.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_X5WT8XgjYkrrB4iSFmWexw_aTJepYkP';

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const TABLE_NAME = 'Shayeb agency';

const BUCKET_NAME = 'broadcaster-images';

let editingId = null;

let oldImageUrl = '';


function showLoginStatus(message,error=false){

const box =
document.getElementById('loginStatus');

box.textContent = message;

box.classList.remove('hidden');

box.classList.remove('ok','err');

box.classList.add(error ? 'err':'ok');

}


async function signIn(){

const email =
document.getElementById('email').value.trim();

const password =
document.getElementById('password').value;

if(!email || !password){

showLoginStatus(
'اكتبي البريد الإلكتروني وكلمة المرور.',
true
);

return;
}

try{

const {error} =
await client.auth.signInWithPassword({
email,
password
});

if(error){

showLoginStatus(error.message,true);

return;
}

showLoginStatus('تم تسجيل الدخول بنجاح.');

await checkSession();

}catch(error){

showLoginStatus(error.message,true);

}

}


async function signUp(){

const email =
document.getElementById('email').value.trim();

const password =
document.getElementById('password').value;

if(!email || !password){

showLoginStatus(
'اكتبي البريد الإلكتروني وكلمة المرور.',
true
);

return;
}

try{

const {error} =
await client.auth.signUp({
email,
password
});

if(error){

showLoginStatus(error.message,true);

return;
}

showLoginStatus(
'تم إنشاء الحساب. إذا طلب Supabase تأكيد البريد، افتحي بريدك الإلكتروني وأكدي الحساب.'
);

}catch(error){

showLoginStatus(error.message,true);

}

}


async function signOut(){

await client.auth.signOut();

document.getElementById('app')
.classList.add('hidden');

document.getElementById('login')
.classList.remove('hidden');

}


async function loadData(){

const status =
document.getElementById('status');

status.textContent =
'جاري تحميل المذيعين...';

try{

const {data,error} =
await client
.from(TABLE_NAME)
.select('*')
.order('id',{ascending:false});

if(error){

status.textContent =
'خطأ: ' + error.message;

status.className =
'status err';

return;
}

renderCards(data || []);

status.textContent =
'تم تحميل البيانات بنجاح.';

status.className =
'status ok';

}catch(error){

status.textContent =
'خطأ: ' + error.message;

status.className =
'status err';

}

}


function renderCards(rows){

const grid =
document.getElementById('grid');

if(!rows.length){

grid.innerHTML =
'<div class="empty">لا توجد مذيعات بعد.<br>اضغطي «＋ إضافة مذيع» لإضافة أول مذيع.</div>';

return;
}

grid.innerHTML =
rows.map(row => {

const image =
row.image_url ||
'https://via.placeholder.com/500?text=No+Image';

return `

<div class="card">

<a
class="photo"
href="${escapeHtml(row.likee_url || '#')}"
target="_blank">

<img
src="${escapeHtml(image)}"
alt="${escapeHtml(row.name || '')}">

<div class="like">
Likee ↗
</div>

</a>

<div class="info">

<div class="name">
${escapeHtml(row.name || 'بدون اسم')}
</div>

<div class="stats">

<div class="stat">
Target:
<b>${escapeHtml(String(row.target || '0'))}</b>
</div>

<div class="stat">
الساعات:
<b>${escapeHtml(String(row.hours || '0'))}</b>
</div>

</div>

<div class="tools">

<button
class="btn muted"
onclick="editCard(${row.id})">
✏️ تعديل
</button>

<button
class="btn danger"
onclick="deleteCard(${row.id})">
🗑️ حذف
</button>

</div>

</div>

</div>

`;

}).join('');

}


function addCard(){

editingId = null;

oldImageUrl = '';

document.getElementById('modalTitle')
.textContent =
'إضافة مذيع';

document.getElementById('fName')
.value = '';

document.getElementById('fLink')
.value = '';

document.getElementById('fTarget')
.value = '';

document.getElementById('fHours')
.value = '';

document.getElementById('fImageFile')
.value = '';

document.getElementById('preview')
.classList.add('hidden');

document.getElementById('modal')
.classList.add('show');

}


async function editCard(id){

try{

const {data,error} =
await client
.from(TABLE_NAME)
.select('*')
.eq('id',id)
.single();

if(error){

alert(error.message);

return;
}

editingId = id;

oldImageUrl =
data.image_url || '';

document.getElementById('modalTitle')
.textContent =
'تعديل مذيع';

document.getElementById('fName')
.value =
data.name || '';

document.getElementById('fLink')
.value =
data.likee_url || '';

document.getElementById('fTarget')
.value =
data.target || '';

document.getElementById('fHours')
.value =
data.hours || '';

document.getElementById('fImageFile')
.value = '';

const preview =
document.getElementById('preview');

if(data.image_url){

preview.src =
data.image_url;

preview.classList.remove('hidden');

}else{

preview.classList.add('hidden');

}

document.getElementById('modal')
.classList.add('show');

}catch(error){

alert(error.message);

}

}


function closeModal(){

document.getElementById('modal')
.classList.remove('show');

}


document.getElementById('fImageFile')
.addEventListener('change',function(){

const file = this.files[0];

if(!file)return;

const preview =
document.getElementById('preview');

preview.src =
URL.createObjectURL(file);

preview.classList.remove('hidden');

});


async function uploadImage(file){

if(!file)return null;

const extension =
file.name.split('.').pop();

const path =
'broadcasters/' +
Date.now() +
'-' +
Math.random().toString(36).slice(2) +
'.' +
extension;

const {error} =
await client.storage
.from(BUCKET_NAME)
.upload(path,file,{
upsert:false
});

if(error){

throw error;

}

const {data} =
client.storage
.from(BUCKET_NAME)
.getPublicUrl(path);

return data.publicUrl;

}


async function saveCard(){

const name =
document.getElementById('fName')
.value.trim();

const likee_url =
document.getElementById('fLink')
.value.trim();

const target =
document.getElementById('fTarget')
.value.trim();

const hours =
document.getElementById('fHours')
.value.trim();

const file =
document.getElementById('fImageFile')
.files[0];

if(!name){

alert('اكتبي اسم المذيع.');

return;
}

const saveBtn =
document.getElementById('saveBtn');

saveBtn.disabled = true;

saveBtn.textContent =
'جاري الحفظ...';

try{

let image_url =
oldImageUrl || null;

if(file){

image_url =
await uploadImage(file);

}

const payload = {

name,
likee_url,
target,
hours,
image_url

};

let result;

if(editingId){

result =
await client
.from(TABLE_NAME)
.update(payload)
.eq('id',editingId);

}else{

result =
await client
.from(TABLE_NAME)
.insert(payload);

}

if(result.error){

throw result.error;

}

closeModal();

await loadData();

}catch(error){

alert(
'حدث خطأ أثناء الحفظ:\n' +
error.message
);

}finally{

saveBtn.disabled = false;

saveBtn.textContent =
'حفظ';

}

}


async function deleteCard(id){

if(!confirm(
'هل أنت متأكدة من حذف هذا المذيع؟'
)){

return;

}

try{

const {error} =
await client
.from(TABLE_NAME)
.delete()
.eq('id',id);

if(error){

alert(error.message);

return;
}

await loadData();

}catch(error){

alert(error.message);

}

}


function escapeHtml(value){

return String(value)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


async function checkSession(){

const {data} =
await client.auth.getSession();

if(data.session){

document.getElementById('login')
.classList.add('hidden');

document.getElementById('app')
.classList.remove('hidden');

await loadData();

}else{

document.getElementById('login')
.classList.remove('hidden');

document.getElementById('app')
.classList.add('hidden');

}

}


client.auth.onAuthStateChange(
(event,session)=>{

if(session){

document.getElementById('login')
.classList.add('hidden');

document.getElementById('app')
.classList.remove('hidden');

loadData();

}else{

document.getElementById('login')
.classList.remove('hidden');

document.getElementById('app')
.classList.add('hidden');

}

});


checkSession();

</script>

</body>
  </html>
